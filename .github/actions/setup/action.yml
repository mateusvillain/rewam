name: Preparar workspace
description: Instala Node, pnpm e as dependências do monorepo com o lockfile congelado.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Instalar dependências
      shell: bash
      run: pnpm install --frozen-lockfile
